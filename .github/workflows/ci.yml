name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check src tests examples notebooks verification

      - name: Format check
        run: uv run ruff format --check src tests examples notebooks verification

      - name: Test
        run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Build docs
        # -W turns warnings into errors; the build is expected to be warning-clean.
        run: uv run --group docs sphinx-build -b html -W --keep-going docs docs/_build/html

# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  # CI enforces a warning-clean build (-W); RTD should always publish, so it
  # does not fail on warnings.
  fail_on_warning: false

# Install only the lightweight docs toolchain. The package is imported from
# ./src and its heavy runtime deps are mocked (see docs/conf.py and
# docs/requirements.txt) — nothing else is installed.
python:
  install:
    - requirements: docs/requirements.txt
